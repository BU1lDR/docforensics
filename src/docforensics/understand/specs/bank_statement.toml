# Bank statement. Keywords are looked for in the lower-cased text of page 1; their weights must reach min_score.
type = "bank_statement"
min_score = 3
logo = true  # right of the bank's name
stamp = ["bank seal"]  # the caption under the drawn stamp

[keywords]
"statement of account" = 3
"account no" = 2
"statement period" = 1
"opening balance" = 2
"closing balance" = 2
"debit" = 1
"credit" = 1
"bank" = 1

[[fields]]
name = "bank"
kind = "text"
position = "title"

[[fields]]
name = "account_holder"
kind = "text"
labels = ["account holder", "customer name", "account name"]
role = "name"

[[fields]]
name = "address"
kind = "text"
labels = ["address", "customer address"]
role = "address"
lines = 4  # a postal address wraps

[[fields]]
name = "account_no"
kind = "id"
labels = ["account no", "account number", "a/c no"]
role = "account"

[[fields]]
name = "period_start"
kind = "date"
labels = ["statement period", "statement from", "period"]
index = 0

[[fields]]
name = "period_end"
kind = "date"
labels = ["statement period", "statement from", "period"]
index = 1

[[fields]]
name = "opening_balance"
kind = "amount"
signed = true
labels = ["opening balance"]

[[fields]]
name = "closing_balance"
kind = "amount"
signed = true
labels = ["closing balance", "closing bal"]

# The date column anchors the rows.
[[table.columns]]
name = "date"
kind = "date"
headers = ["date", "txn date", "tran date", "transaction date", "posting date", "value date"]

[[table.columns]]
name = "description"
kind = "text"
headers = ["description", "particulars", "details", "transaction details", "narrative", "remarks", "transaction remarks"]

[[table.columns]]
name = "debit"
kind = "amount"
headers = ["debit", "debits", "debit amount", "withdrawal", "withdrawals", "withdrawal amt", "withdrawal amount"]

[[table.columns]]
name = "credit"
kind = "amount"
headers = ["credit", "credits", "credit amount", "deposit", "deposits", "deposit amt", "deposit amount"]

[[table.columns]]
name = "balance"
kind = "amount"
signed = true
headers = ["balance", "running balance", "running bal", "closing balance", "closing bal"]
