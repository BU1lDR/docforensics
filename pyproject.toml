[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "docforensics"
version = "0.1.0"
description = "Offline document forensics for a human investigator: multi-document cases, evidence-traced findings, dossier."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dynamic = ["dependencies"]

[project.scripts]
docforensics = "docforensics.cli:main"

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docforensics = ["**/*.toml", "**/*.json", "web/static/*"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
markers = ["ocr: loads the OCR engine (slow, 1-2 s per page)"]
