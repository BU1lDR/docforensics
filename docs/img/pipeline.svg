<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-label="The pipeline: ingest, then read, classify, extract, forensics, checks, link, explain, crops and dossier, with an audit trail under every stage"><title>The pipeline: ingest, then read, classify, extract, forensics, checks, link, explain, crops and dossier, with an audit trail under every stage</title><style>text{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.caret{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{fill:transparent}}@media (prefers-reduced-motion:reduce){.caret{animation:none}}</style><rect width="960" height="520" rx="14" fill="#0D1117" stroke="#1F2937"/><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5B6E8A"/></marker></defs><text x="40" y="44" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">Nine stages after ingest, one audit trail under all of them</text><rect x="40.0" y="72" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="54.0" y="96" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">0</text><text x="54.0" y="119" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Ingest</text><text x="54.0" y="138" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">type, size,</text><text x="54.0" y="153" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">sha256</text><path d="M190.0 116.0H219.5" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="223.5" y="72" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="237.5" y="96" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">1</text><text x="237.5" y="119" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Read</text><text x="237.5" y="138" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">text layer</text><text x="237.5" y="153" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">or OCR</text><path d="M373.5 116.0H403.0" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="407.0" y="72" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="421.0" y="96" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">2</text><text x="421.0" y="119" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Classify</text><text x="421.0" y="138" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">3 types,</text><text x="421.0" y="153" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">or unknown</text><path d="M557.0 116.0H586.5" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="590.5" y="72" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="604.5" y="96" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">3</text><text x="604.5" y="119" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Extract</text><text x="604.5" y="138" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">values, boxes,</text><text x="604.5" y="153" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">confidence</text><path d="M740.5 116.0H770.0" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="774.0" y="72" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="788.0" y="96" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">4</text><text x="788.0" y="119" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Forensics</text><text x="788.0" y="138" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">revisions,</text><text x="788.0" y="153" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">pixels, bytes</text><rect x="40.0" y="204" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="54.0" y="228" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">5</text><text x="54.0" y="251" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Checks</text><text x="54.0" y="270" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">within and</text><text x="54.0" y="285" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">across files</text><path d="M190.0 248.0H219.5" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="223.5" y="204" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="237.5" y="228" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">6</text><text x="237.5" y="251" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Link</text><text x="237.5" y="270" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">clusters,</text><text x="237.5" y="285" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">entities</text><path d="M373.5 248.0H403.0" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="407.0" y="204" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="421.0" y="228" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">7</text><text x="421.0" y="251" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Explain</text><text x="421.0" y="270" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">wording per</text><text x="421.0" y="285" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">finding</text><path d="M557.0 248.0H586.5" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="590.5" y="204" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="604.5" y="228" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">8</text><text x="604.5" y="251" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Crops</text><text x="604.5" y="270" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">marked crop</text><text x="604.5" y="285" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">per place</text><path d="M740.5 248.0H770.0" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="774.0" y="204" width="146" height="88" rx="8" fill="#121A25" stroke="#33425A"/><text x="788.0" y="228" font-size="13" fill="#00FFCC" font-weight="700" text-anchor="start">9</text><text x="788.0" y="251" font-size="16" fill="#E6EDF3" font-weight="700" text-anchor="start">Dossier</text><text x="788.0" y="270" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">HTML and JSON,</text><text x="788.0" y="285" font-size="11.5" fill="#9AA7B4" font-weight="400" text-anchor="start">hashed</text><path d="M847.0 163V180H113.0V200" fill="none" stroke="#5B6E8A" stroke-width="1.5" marker-end="url(#ar)"/><rect x="40" y="322" width="880" height="62" rx="8" fill="#0F1A1F" stroke="#00FFCC" stroke-opacity=".55"/><text x="58" y="348" font-size="16" fill="#00FFCC" font-weight="700" text-anchor="start">Audit trail under every stage</text><text x="58" y="370" font-size="13" fill="#9AA7B4" font-weight="400" text-anchor="start">each event carries the hash of the one before; checkpoints are signed (Ed25519); verify-audit checks both</text><text x="40" y="416" font-size="14" fill="#E6EDF3" font-weight="700" text-anchor="start">Failures stay visible</text><text x="40" y="436" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">A failing stage becomes a</text><text x="40" y="453" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">visible limitation in the</text><text x="40" y="470" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">dossier, not a crash.</text><text x="340" y="416" font-size="14" fill="#E6EDF3" font-weight="700" text-anchor="start">Optional local model</text><text x="340" y="436" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">Off unless asked. It words</text><text x="340" y="453" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">headlines and a reading order,</text><text x="340" y="470" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">labelled INFERENCE. It cannot</text><text x="340" y="487" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">add, change or remove a finding.</text><text x="640" y="416" font-size="14" fill="#E6EDF3" font-weight="700" text-anchor="start">Offline</text><text x="640" y="436" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">After install nothing uses the</text><text x="640" y="453" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">network. The review desk</text><text x="640" y="470" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">answers on 127.0.0.1 only.</text></svg>
