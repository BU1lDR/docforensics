<svg xmlns="http://www.w3.org/2000/svg" width="960" height="298" viewBox="0 0 960 298" role="img" aria-label="The four classes of finding: observation, inconsistency, potential manipulation and limitation of the analysis"><title>The four classes of finding: observation, inconsistency, potential manipulation and limitation of the analysis</title><style>text{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.caret{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{fill:transparent}}@media (prefers-reduced-motion:reduce){.caret{animation:none}}</style><rect width="960" height="298" rx="14" fill="#0D1117" stroke="#1F2937"/><text x="40" y="40" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">Four kinds of finding, kept apart in the desk and in the dossier</text><rect x="40" y="62" width="432" height="104" rx="6" fill="#121A25" stroke="#1F2937"/><path d="M43 68V160" stroke="#3082f6" stroke-width="5"/><path d="M64 102Q80 84 96 102Q80 120 64 102Z" fill="none" stroke="#3082f6" stroke-width="2.5"/><circle cx="80" cy="102" r="5" fill="#3082f6"/><text x="114" y="94" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="start">Observation</text><text x="114" y="118" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">Something seen, which untouched documents</text><text x="114" y="135" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">can show too, such as bytes after the end</text><text x="114" y="152" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">of a PDF.</text><rect x="488" y="62" width="432" height="104" rx="6" fill="#121A25" stroke="#1F2937"/><path d="M491 68V160" stroke="#e15247" stroke-width="5"/><text x="528" y="113" font-size="34" fill="#e15247" font-weight="700" text-anchor="middle">≠</text><text x="562" y="94" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="start">Inconsistency</text><text x="562" y="118" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">Two things that should agree do not, by a</text><text x="562" y="135" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">stated measure and tolerance. Example:</text><text x="562" y="152" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">declared income against the payslip.</text><rect x="40" y="180" width="432" height="104" rx="6" fill="#121A25" stroke="#1F2937"/><path d="M43 186V278" stroke="#e34cbb" stroke-width="5" stroke-dasharray="6 3"/><path d="M80 204L96 220L80 236L64 220Z" fill="none" stroke="#e34cbb" stroke-width="2.5"/><circle cx="80" cy="220" r="3.5" fill="#e34cbb"/><text x="114" y="212" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="start">Potential manipulation (for review)</text><text x="114" y="236" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">Independent kinds of check point at one</text><text x="114" y="253" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">place. A priority for review, not a</text><text x="114" y="270" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">probability.</text><rect x="488" y="180" width="432" height="104" rx="6" fill="#121A25" stroke="#1F2937"/><path d="M491 186V278" stroke="#78838f" stroke-width="5" stroke-dasharray="2 3"/><circle cx="528" cy="220" r="15" fill="none" stroke="#78838f" stroke-width="2.5" stroke-dasharray="2 3"/><text x="528" y="226" font-size="18" fill="#78838f" font-weight="700" text-anchor="middle">i</text><text x="562" y="212" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="start">Limitation of the analysis</text><text x="562" y="236" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">A step could not run in full, so what it</text><text x="562" y="253" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">would have shown is unknown. It is never</text><text x="562" y="270" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">counted as a pass.</text></svg>
