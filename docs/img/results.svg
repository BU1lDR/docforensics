<svg xmlns="http://www.w3.org/2000/svg" width="960" height="490" viewBox="0 0 960 490" role="img" aria-label="Run 1 and run 2 on the held-out split: planted changes found by medium, and the headline counts"><title>Run 1 and run 2 on the held-out split: planted changes found by medium, and the headline counts</title><style>text{font-family:ui-monospace, 'Cascadia Mono', 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}.caret{animation:blink 1.1s steps(1) infinite}@keyframes blink{50%{fill:transparent}}@media (prefers-reduced-motion:reduce){.caret{animation:none}}</style><rect width="960" height="490" rx="14" fill="#0D1117" stroke="#1F2937"/><text x="40" y="40" font-size="18" fill="#E6EDF3" font-weight="700" text-anchor="start">Test split: 144 synthetic cases, 48 genuine, 96 with one planted change</text><text x="40" y="64" font-size="13" fill="#9AA7B4" font-weight="400" text-anchor="start">Run 1: the tool at spec-freeze (5 Nov). Run 2: the final pipeline at freeze-2 (8 Nov).</text><text x="40" y="82" font-size="13" fill="#9AA7B4" font-weight="400" text-anchor="start">Same cases, same scorer. Run 2 is not a blind test: the report of run 1 had been read.</text><text x="40" y="126" font-size="15" fill="#E6EDF3" font-weight="700" text-anchor="start">Planted changes found, by medium</text><rect x="40" y="138" width="12" height="12" rx="2" fill="#17806E"/><text x="58" y="149" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">Run 1</text><rect x="124" y="138" width="12" height="12" rx="2" fill="#34D3B3"/><text x="142" y="149" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">Run 2</text><path d="M170.0 162V398" stroke="#1F2937"/><text x="170.0" y="416" font-size="11.5" fill="#7A8794" font-weight="400" text-anchor="middle">0 %</text><path d="M335.0 162V398" stroke="#1F2937"/><text x="335.0" y="416" font-size="11.5" fill="#7A8794" font-weight="400" text-anchor="middle">50 %</text><path d="M500.0 162V398" stroke="#1F2937"/><text x="500.0" y="416" font-size="11.5" fill="#7A8794" font-weight="400" text-anchor="middle">100 %</text><text x="40" y="194" font-size="13" fill="#E6EDF3" font-weight="400" text-anchor="start">Digital</text><rect x="170" y="172" width="319.0" height="16" rx="2" fill="#17806E"/><text x="497.0" y="185" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">58 of 60</text><rect x="170" y="192" width="319.0" height="16" rx="2" fill="#34D3B3"/><text x="497.0" y="205" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">58 of 60</text><text x="40" y="252" font-size="13" fill="#E6EDF3" font-weight="400" text-anchor="start">Mild scan</text><rect x="170" y="230" width="238.3" height="16" rx="2" fill="#17806E"/><text x="416.33333333333337" y="243" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">13 of 18</text><rect x="170" y="250" width="238.3" height="16" rx="2" fill="#34D3B3"/><text x="416.33333333333337" y="263" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">13 of 18</text><text x="40" y="310" font-size="13" fill="#E6EDF3" font-weight="400" text-anchor="start">150 dpi scan</text><rect x="170" y="288" width="220.0" height="16" rx="2" fill="#17806E"/><text x="398.0" y="301" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">6 of 9</text><rect x="170" y="308" width="256.7" height="16" rx="2" fill="#34D3B3"/><text x="434.6666666666667" y="321" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">7 of 9</text><text x="40" y="368" font-size="13" fill="#E6EDF3" font-weight="400" text-anchor="start">120 dpi scan</text><rect x="170" y="346" width="73.3" height="16" rx="2" fill="#17806E"/><text x="251.33333333333331" y="359" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">2 of 9</text><rect x="170" y="366" width="183.3" height="16" rx="2" fill="#34D3B3"/><text x="361.33333333333337" y="379" font-size="12" fill="#9AA7B4" font-weight="400" text-anchor="start">5 of 9</text><rect x="640" y="112" width="280" height="68" rx="6" fill="#121A25" stroke="#1F2937"/><text x="656" y="143" font-size="26" fill="#E6EDF3" font-weight="700" text-anchor="start">83 of 96</text><text x="656" y="160" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">planted changes found (86 %)</text><text x="656" y="174" font-size="11" fill="#7A8794" font-weight="400" text-anchor="start">run 1: 79 of 96 (82 %)</text><rect x="640" y="190" width="280" height="68" rx="6" fill="#121A25" stroke="#1F2937"/><text x="656" y="221" font-size="26" fill="#E6EDF3" font-weight="700" text-anchor="start">40 of 48</text><text x="656" y="238" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">changes with a place, located</text><text x="656" y="252" font-size="11" fill="#7A8794" font-weight="400" text-anchor="start">run 1: 37 of 48; overlap 0.5 or more</text><rect x="640" y="268" width="280" height="68" rx="6" fill="#121A25" stroke="#1F2937"/><text x="656" y="299" font-size="26" fill="#E6EDF3" font-weight="700" text-anchor="start">2 of 144</text><text x="656" y="316" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">genuine documents flagged</text><text x="656" y="330" font-size="11" fill="#7A8794" font-weight="400" text-anchor="start">run 1: 1; both of run 2 on one page</text><rect x="640" y="346" width="280" height="68" rx="6" fill="#121A25" stroke="#1F2937"/><text x="656" y="377" font-size="26" fill="#E6EDF3" font-weight="700" text-anchor="start">13</text><text x="656" y="394" font-size="12.5" fill="#9AA7B4" font-weight="400" text-anchor="start">planted changes missed</text><text x="656" y="408" font-size="11" fill="#7A8794" font-weight="400" text-anchor="start">run 1: 17</text><text x="40" y="450" font-size="12" fill="#7A8794" font-weight="400" text-anchor="start">Counts of planted changes. Nine cases per scan medium is a small sample: read them as counts, not rates.</text><text x="40" y="468" font-size="12" fill="#7A8794" font-weight="400" text-anchor="start">144 genuine documents = 48 genuine cases of three documents each. Both flags are on page 1 of test-0143, a 120 dpi scan.</text></svg>
